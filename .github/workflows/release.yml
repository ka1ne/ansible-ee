name: Release

# Publishes the Execution Environment to GHCR.
#
# Tagging:
#   push to main   → :latest and :<short-sha>
#   push of v1.2.3 → :1.2.3 and :<short-sha>
#
# The first successful push creates the package as private. Make it public once,
# by hand, at https://github.com/users/ka1ne/packages/container/ansible-ee/settings

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install the toolchain
        run: pip install -r requirements-dev.txt

      - name: Work out the image tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: make ee-build IMAGE_TAG=${{ steps.tag.outputs.value }}

      - name: Verify the image before publishing
        run: |
          docker run --rm ghcr.io/ka1ne/ansible-ee:${{ steps.tag.outputs.value }} ansible --version

      - name: Push
        run: make ee-push IMAGE_TAG=${{ steps.tag.outputs.value }}
