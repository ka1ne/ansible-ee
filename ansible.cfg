[defaults]
# No default inventory on purpose: every path in this project passes -i
# explicitly (inventories/local for the dev harness, inventories/example as a
# template, an AWX-managed inventory in production). A default here would make
# it too easy to run against the wrong hosts.
#
# Roles do get a path, because playbooks live in playbooks/ and Ansible would
# otherwise only look in playbooks/roles/. Relative to the repository root,
# which is where every documented command is run from.
roles_path = ./roles

# Performance
forks = 20
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 3600

# Pipelining is a large win over WinRM, and safe here because the EE never
# uses sudo with requiretty.
pipelining = True

# Security
display_args_to_stdout = False
no_target_syslog = True
allow_world_readable_tmpfiles = False

# Output
callbacks_enabled = profile_tasks, timer
log_path = /tmp/ansible.log

# Connection
host_key_checking = False
timeout = 30
retry_files_enabled = False

[privilege_escalation]
become = False
