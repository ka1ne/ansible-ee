[defaults]
# Inventory
inventory = inventory/

# Performance
forks = 20
pipelining = True
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 3600

# Security
display_args_to_stdout = False
no_target_syslog = True
allow_world_readable_tmpfiles = False

# Logging
log_path = /tmp/ansible.log
callbacks_enabled = profile_tasks, timer

# Retry
retry_files_enabled = False

# SSH
host_key_checking = False
timeout = 30

# Galaxy — public by default.
# Set GALAXY_MIRROR_URL + GALAXY_MIRROR_TOKEN to route through an internal
# mirror (air-gapped CI).  The private_hub stanza is ignored when those vars
# are unset because execution-environment.yml only activates it conditionally.
[galaxy]

[galaxy_server.private_hub]
url = ${GALAXY_MIRROR_URL}
auth_url = ${GALAXY_MIRROR_URL}
token = ${GALAXY_MIRROR_TOKEN}

[privilege_escalation]
become = False
