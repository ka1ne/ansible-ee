---
# Minimal git clone. Swap in the catalog git-clone task if you already have
# Tekton Hub tasks installed; this exists so the pipeline works with nothing
# else applied to the cluster.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone
spec:
  params:
    - name: url
      type: string
    - name: revision
      type: string
      default: main
  workspaces:
    - name: output
  steps:
    - name: clone
      image: alpine/git:latest
      script: |
        #!/usr/bin/env sh
        set -eu
        git clone --depth 1 --branch "$(params.revision)" \
          "$(params.url)" "$(workspaces.output.path)"
