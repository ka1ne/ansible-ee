---
# clone → build the EE → prove it can reach a Windows host.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: ansible-ee
spec:
  params:
    - name: GIT_URL
      type: string
      description: Repository URL to clone
    - name: GIT_REVISION
      type: string
      description: Branch or tag to check out
      default: main
    - name: IMAGE
      type: string
      description: Fully qualified EE image name (registry/repo/name:tag)
    - name: INVENTORY
      type: string
      description: Inventory the probe targets
      default: inventories/local/hosts.yml
  workspaces:
    - name: source
  tasks:
    - name: clone
      taskRef:
        name: git-clone
      workspaces:
        - name: output
          workspace: source
      params:
        - name: url
          value: $(params.GIT_URL)
        - name: revision
          value: $(params.GIT_REVISION)

    - name: build-ee
      runAfter: [clone]
      taskRef:
        name: build-ansible-ee
      workspaces:
        - name: source
          workspace: source
      params:
        - name: IMAGE
          value: $(params.IMAGE)

    - name: probe
      runAfter: [build-ee]
      taskRef:
        name: run-connectivity-probe
      workspaces:
        - name: source
          workspace: source
      params:
        - name: IMAGE
          value: $(params.IMAGE)
        - name: INVENTORY
          value: $(params.INVENTORY)
