---
# ee/execution-environment.yml
#
# The single source of truth for the Execution Environment image.
#
# Every build path uses this file, so there is nothing to keep in sync:
#   local            make ee-build
#   GitHub Actions   make ee-build / make ee-push
#   OpenShift        make ee-context, then buildah over the generated context
#
# Build from the repository root, not from this directory:
#   ansible-builder build --file ee/execution-environment.yml ...

version: 3

images:
  base_image:
    # UBI9 full — ships Python 3 and dnf, and pulls without a Red Hat login.
    # Override with EE_BASE_IMAGE to use an internal mirror. If you switch to
    # a minimal base, change package_manager_path to /usr/bin/microdnf below.
    name: ${EE_BASE_IMAGE:-registry.access.redhat.com/ubi9:latest}

dependencies:
  galaxy: requirements.yml
  python: requirements.txt
  system: bindep.txt

  # UBI9's default python3 is 3.9, and ansible-core past 2.15 needs 3.10+ on the
  # controller. Without pinning the interpreter, pip silently settles on
  # ansible-core 2.15 — which is end-of-life. Install 3.11 and build against it.
  python_interpreter:
    package_system: python3.11
    python_path: /usr/bin/python3.11

  ansible_core:
    package_pip: ansible-core>=2.17,<2.21
  ansible_runner:
    package_pip: ansible-runner>=2.3,<3

options:
  package_manager_path: /usr/bin/dnf

additional_build_files:
  # Paths are resolved relative to this file's directory.
  - src: ../ansible.cfg
    dest: config

additional_build_steps:
  prepend_galaxy:
    # Optional internal Galaxy mirror. When GALAXY_MIRROR_URL is set, write a
    # galaxy config so ansible-galaxy pulls collections from the mirror during
    # the build. Leave both build args unset to use public Galaxy.
    - ARG GALAXY_MIRROR_URL
    - ARG GALAXY_MIRROR_TOKEN
    # yamllint disable-line rule:line-length
    - RUN test -z "$GALAXY_MIRROR_URL" || (mkdir -p /etc/ansible && printf '[galaxy]\nserver_list=private_hub\n\n[galaxy_server.private_hub]\nurl=%s\ntoken=%s\n' "$GALAXY_MIRROR_URL" "$GALAXY_MIRROR_TOKEN" > /etc/ansible/ansible.cfg)

  append_final:
    # Written last so it replaces any mirror config left by prepend_galaxy.
    - COPY _build/config/ansible.cfg /etc/ansible/ansible.cfg
    - RUN dnf clean all && rm -rf /var/cache/dnf /var/cache/yum
