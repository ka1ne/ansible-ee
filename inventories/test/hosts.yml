---
# Test inventory — points at an existing Windows VM on your network.
#
# Everything comes from the environment so the same file works for any target;
# dev/scripts/run-tests.sh sets these from its command-line flags.
#
#   TEST_HOST       IP address or hostname of the VM        (required)
#   TEST_USER       account to authenticate as              (default: ansible)
#   TEST_PASSWORD   password for that account               (required)
#   TEST_TRANSPORT  ntlm | credssp | kerberos | basic       (default: ntlm)
#   TEST_SCHEME     http | https                            (default: http)
#   TEST_PORT       WinRM port                              (default: 5985)
#
# The inventory hostname is fixed at `test-target` so test output reads the same
# whichever machine you point it at; the real address is in ansible_host.

all:
  children:
    windows:
      hosts:
        test-target:
          # `mandatory` only catches undefined, and an unset env var looks up as
          # the empty string — which would silently target nothing. undef() is
          # what actually fails the run with a message worth reading.
          ansible_host: >-
            {{ lookup('env', 'TEST_HOST')
               or undef('TEST_HOST is not set — pass --host to run-tests.sh, or set it in .env') }}
      vars:
        ansible_connection: winrm
        ansible_user: "{{ lookup('env', 'TEST_USER') | default('ansible', true) }}"
        ansible_password: >-
          {{ lookup('env', 'TEST_PASSWORD')
             or undef('TEST_PASSWORD is not set — put it in .env rather than on the command line') }}

        ansible_winrm_transport: "{{ lookup('env', 'TEST_TRANSPORT') | default('ntlm', true) }}"
        ansible_winrm_scheme: "{{ lookup('env', 'TEST_SCHEME') | default('http', true) }}"
        ansible_port: "{{ lookup('env', 'TEST_PORT') | default(5985, true) | int }}"

        # Test targets are lab machines, so a self-signed certificate is normal.
        # Set to 'validate' if your VMs present certificates you trust.
        ansible_winrm_server_cert_validation: ignore

        ansible_winrm_operation_timeout_sec: 60
        ansible_winrm_read_timeout_sec: 70
