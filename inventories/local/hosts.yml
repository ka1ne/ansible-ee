---
# Local development inventory — a single Windows host, usually the machine you
# are sitting at, reached from a container.
#
# Credentials come from the environment so nothing sensitive lands in git.
# dev/scripts/run-local.sh loads them from .env and passes them through.

all:
  children:
    windows:
      hosts:
        local-windows:
          # host.containers.internal resolves to the container host, which is
          # what you want when targeting your own machine. Set WINRM_HOST to
          # point somewhere else.
          ansible_host: "{{ lookup('env', 'WINRM_HOST') | default('host.containers.internal', true) }}"
      vars:
        ansible_connection: winrm
        ansible_user: "{{ lookup('env', 'WINRM_USER') }}"
        ansible_password: "{{ lookup('env', 'WINRM_PASSWORD') }}"

        # NTLM over plain HTTP. Fine for a local workgroup machine on a trusted
        # network; use HTTPS on 5986 for anything else. See
        # docs/windows-host-prep.md.
        ansible_winrm_transport: ntlm
        ansible_winrm_scheme: http
        ansible_port: 5985
        ansible_winrm_server_cert_validation: ignore

        ansible_winrm_operation_timeout_sec: 60
        ansible_winrm_read_timeout_sec: 70
