---
# roles/dotnet_migrate/tasks/main.yml
# Stub — replace with your existing .NET deployment logic

- name: Validate dotnet config input
  ansible.builtin.assert:
    that:
      - dotnet_config is defined
      - dotnet_config.deploy_path is defined
      - dotnet_config.artifact_source is defined
    fail_msg: "dotnet_config requires deploy_path and artifact_source"

- name: Ensure deploy directory exists
  ansible.windows.win_file:
    path: "{{ dotnet_config.deploy_path }}"
    state: directory

- name: Download application artifact
  ansible.windows.win_get_url:
    url: "{{ dotnet_config.artifact_source }}"
    dest: "C:\\temp\\app-artifact.zip"
    force: true
  no_log: true

- name: Stop application pool before deploy
  community.windows.win_iis_webapppool:
    name: "{{ iis_config.app_pool | default('DefaultAppPool') }}"
    state: stopped
  when: iis_config is defined
  register: dotnet_migrate_pool_stop
  # On a first deploy the pool does not exist yet, and failing to stop a pool
  # that was never there should not fail the run. Any other error still should,
  # which blanket ignore_errors would have swallowed.
  failed_when:
    - dotnet_migrate_pool_stop is failed
    - "'not exist' not in (dotnet_migrate_pool_stop.msg | default('') | lower)"
    - "'not found' not in (dotnet_migrate_pool_stop.msg | default('') | lower)"

- name: Extract artifact to deploy path
  community.windows.win_unzip:
    src: "C:\\temp\\app-artifact.zip"
    dest: "{{ dotnet_config.deploy_path }}"
    delete_archive: true

- name: Start application pool after deploy
  community.windows.win_iis_webapppool:
    name: "{{ iis_config.app_pool | default('DefaultAppPool') }}"
    state: started
  when: iis_config is defined
