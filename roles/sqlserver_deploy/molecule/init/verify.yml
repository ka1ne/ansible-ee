---
# molecule/init/verify.yml
# Re-pings and asserts pong — confirms the EE→WinRM path is stable.

- name: Verify — assert WinRM connectivity
  hosts: all
  gather_facts: false

  tasks:
    - name: Ping Windows host
      ansible.windows.win_ping:
      register: ping_result

    - name: Assert pong
      ansible.builtin.assert:
        that:
          - ping_result.ping == 'pong'
        fail_msg: >-
          win_ping did not return 'pong' (got '{{ ping_result.ping | default("no response") }}').
          Check WinRM connectivity and EE image.
        success_msg: "WinRM confirmed via EE: {{ ping_result.ping }}"
