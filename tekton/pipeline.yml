apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: ansible-ee-poc
spec:
  params:
    - name: GIT_URL
      type: string
      description: Repository URL to clone
    - name: GIT_REVISION
      type: string
      description: Branch or tag to check out
      default: feat/poc
    - name: IMAGE
      type: string
      description: Fully qualified EE image name (registry/repo/name:tag)
  workspaces:
    - name: source
  tasks:
    - name: clone
      taskRef:
        name: git-clone
      workspaces:
        - name: output
          workspace: source
      params:
        - name: url
          value: $(params.GIT_URL)
        - name: revision
          value: $(params.GIT_REVISION)

    - name: build-ee
      runAfter: [clone]
      taskRef:
        name: build-ansible-ee
      workspaces:
        - name: source
          workspace: source
      params:
        - name: IMAGE
          value: $(params.IMAGE)

    - name: run-poc
      runAfter: [build-ee]
      taskRef:
        name: run-ansible-poc
      workspaces:
        - name: source
          workspace: source
      params:
        - name: IMAGE
          value: $(params.IMAGE)
