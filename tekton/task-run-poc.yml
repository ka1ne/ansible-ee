apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: run-ansible-poc
spec:
  params:
    - name: IMAGE
      type: string
      description: Ansible EE image to run
  workspaces:
    - name: source
  steps:
    - name: run-playbook
      image: $(params.IMAGE)
      workingDir: $(workspaces.source.path)
      env:
        - name: WINRM_HOST
          valueFrom:
            secretKeyRef:
              name: winrm-credentials
              key: host
        - name: WINRM_USER
          valueFrom:
            secretKeyRef:
              name: winrm-credentials
              key: username
        - name: WINRM_PASSWORD
          valueFrom:
            secretKeyRef:
              name: winrm-credentials
              key: password
        - name: MSSQL_HOST
          valueFrom:
            secretKeyRef:
              name: winrm-credentials
              key: mssql_host
        - name: MSSQL_SA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: winrm-credentials
              key: mssql_sa_password
        - name: ANSIBLE_STDOUT_CALLBACK
          value: yaml
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        ansible-playbook \
          -i poc/inventory/poc-local.yml \
          poc/playbooks/winrm-poc.yml \
          -v
