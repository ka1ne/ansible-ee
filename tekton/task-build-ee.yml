apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-ansible-ee
spec:
  params:
    - name: IMAGE
      type: string
      description: Fully qualified image name to build and push (registry/repo/name:tag)
  workspaces:
    - name: source
  steps:
    - name: build-and-push
      image: quay.io/buildah/stable:v1.33.0
      workingDir: $(workspaces.source.path)
      securityContext:
        privileged: true
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        buildah bud \
          --storage-driver=vfs \
          --format=oci \
          -t "$(params.IMAGE)" \
          .
        buildah push \
          --storage-driver=vfs \
          "$(params.IMAGE)"
        echo "Built and pushed $(params.IMAGE)"
