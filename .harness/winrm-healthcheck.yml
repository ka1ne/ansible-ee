---
# WinRM Connectivity Healthcheck
#
# Purpose: Validates that OCP pods in the Harness delegate namespace can reach
#          on-prem Windows targets over WinRM before any deployment runs.
#          Run this first when setting up the POC — if it fails, stop and raise
#          the network path with your infra/network team before going further.
#
# Trigger: Manual / scheduled (run before deployment pipelines)
# Replace: ocp_cluster, container_registry connector refs with real identifiers

pipeline:
  name: WinRM Connectivity Healthcheck
  identifier: winrm_healthcheck
  projectIdentifier: platform_engineering
  orgIdentifier: default

  stages:
    - stage:
        name: Probe
        identifier: probe
        type: CI
        spec:
          cloneCodebase: false
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: ocp_cluster          # TODO: replace with real connector ID
              namespace: platform-ci
              automountServiceAccountToken: true
              nodeSelector: {}
              os: Linux

          execution:
            steps:
              - step:
                  name: WinRM Probe
                  identifier: winrm_probe
                  type: Run
                  spec:
                    connectorRef: container_registry  # TODO: replace with real connector ID
                    image: ghcr.io/ka1ne/ansible-ee:dev
                    shell: Sh
                    command: |
                      python3 - <<'EOF'
                      import winrm, os, sys

                      raw     = os.environ.get("WINRM_TARGETS", "")
                      targets = [t.strip() for t in raw.split(",") if t.strip()]
                      user    = os.environ.get("ANSIBLE_WINRM_USER")
                      passwd  = os.environ.get("ANSIBLE_WINRM_PASSWORD")

                      if not targets:
                          print("ERROR: WINRM_TARGETS is empty")
                          sys.exit(1)

                      if not user or not passwd:
                          print("ERROR: ANSIBLE_WINRM_USER / ANSIBLE_WINRM_PASSWORD not set")
                          sys.exit(1)

                      failed = []
                      for host in targets:
                          print(f"Probing {host} ...", flush=True)
                          try:
                              s = winrm.Session(
                                  host,
                                  auth=(user, passwd),
                                  transport="ntlm",
                                  server_cert_validation="ignore",
                                  read_timeout_sec=30,
                                  operation_timeout_sec=20,
                              )
                              r = s.run_cmd("hostname")
                              if r.status_code == 0:
                                  print(f"  OK  -> {r.std_out.decode().strip()}", flush=True)
                              else:
                                  err = r.std_err.decode().strip()
                                  print(f"  FAIL -> status={r.status_code} err={err}", flush=True)
                                  failed.append(host)
                          except Exception as exc:
                              print(f"  ERROR -> {exc}", flush=True)
                              failed.append(host)

                      print("")
                      if failed:
                          print(f"FAILED targets ({len(failed)}): {', '.join(failed)}")
                          sys.exit(1)
                      print(f"All {len(targets)} target(s) reachable.")
                      EOF
                    envVariables:
                      # Comma-separated list of dev Windows hostnames to probe
                      WINRM_TARGETS: "dev-win-01.ka1ne.dev,dev-win-02.ka1ne.dev"
                      ANSIBLE_WINRM_USER: <+secrets.getValue("winrm_user")>
                      ANSIBLE_WINRM_PASSWORD: <+secrets.getValue("winrm_password")>
                    resources:
                      limits:
                        cpu: "250m"
                        memory: 256Mi
