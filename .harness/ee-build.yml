# .harness/ee-build.yml
# Harness CI pipeline — builds, scans, and publishes the Ansible EE image
# Trigger: PR merge to main on ansible-ee repo

pipeline:
  name: ee-build
  identifier: ee_build
  projectIdentifier: platform_engineering
  orgIdentifier: default
  tags:
    team: platform-engineering
    type: image-build

  properties:
    ci:
      codebase:
        connectorRef: git_ansible_ee
        repoName: ansible-ee
        build: <+input>

  stages:
    - stage:
        name: Build and Scan EE
        identifier: build_scan
        type: CI
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: ocp_cluster
              namespace: platform-ci
              automountServiceAccountToken: true
          execution:
            steps:
              # -- Lint --
              - step:
                  name: Lint Playbooks
                  identifier: lint
                  type: Run
                  spec:
                    shell: Bash
                    command: |
                      pip install ansible-lint yamllint --quiet --break-system-packages
                      yamllint -c .yamllint.yml .
                      ansible-lint playbooks/ roles/ --strict
                    imagePullPolicy: IfNotPresent

              # -- Build EE context --
              - step:
                  name: Generate Containerfile
                  identifier: generate_containerfile
                  type: Run
                  spec:
                    shell: Bash
                    command: |
                      pip install ansible-builder --quiet --break-system-packages
                      ansible-builder create \
                        --file execution-environment.yml \
                        --output-filename Containerfile
                      echo "--- Generated Containerfile ---"
                      cat context/Containerfile

              # -- Build image --
              - step:
                  name: Build EE Image
                  identifier: build_image
                  type: BuildAndPushDockerRegistry
                  spec:
                    connectorRef: container_registry
                    repo: registry.internal.bank/ansible-ee
                    tags:
                      - <+pipeline.sequenceId>
                      - <+codebase.commitSha>
                      - latest
                    dockerfile: context/Containerfile
                    context: context/
                    buildArgs:
                      GALAXY_MIRROR_URL: https://galaxy-mirror.internal/
                      GALAXY_MIRROR_TOKEN: <+secrets.getValue("galaxy_mirror_token")>

              # -- Scan image --
              - step:
                  name: Trivy Image Scan
                  identifier: trivy_scan
                  type: Run
                  spec:
                    connectorRef: container_registry
                    image: aquasec/trivy:latest
                    shell: Bash
                    command: |
                      trivy image \
                        --severity HIGH,CRITICAL \
                        --exit-code 1 \
                        --format table \
                        --ignorefile .trivyignore \
                        registry.internal.bank/ansible-ee:<+pipeline.sequenceId>

              # -- SBOM --
              - step:
                  name: Generate SBOM
                  identifier: sbom
                  type: Run
                  spec:
                    connectorRef: container_registry
                    image: anchore/syft:latest
                    shell: Bash
                    command: |
                      syft registry.internal.bank/ansible-ee:<+pipeline.sequenceId> \
                        -o spdx-json \
                        > /harness/sbom.spdx.json
                    outputVariables:
                      - name: sbom_path
                        type: String
                        value: /harness/sbom.spdx.json

              # -- Scan Galaxy collection contents --
              - step:
                  name: Scan Collections
                  identifier: scan_collections
                  type: Run
                  spec:
                    connectorRef: container_registry
                    image: registry.internal.bank/ansible-ee:<+pipeline.sequenceId>
                    shell: Bash
                    command: |
                      pip install bandit pip-audit --quiet --break-system-packages
                      chmod +x scripts/scan-collections.sh
                      ./scripts/scan-collections.sh \
                        /usr/share/ansible/collections/ansible_collections \
                        /tmp/scan-results
                    # Allow soft failure — review results, don't hard-gate on first run
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Ignore
