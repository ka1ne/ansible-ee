# .harness/ee-build.yml
# Harness CI pipeline — builds, scans, and publishes the Ansible EE image
# Trigger: PR merge to main on ansible-ee repo

pipeline:
  name: ee-build
  identifier: ee_build
  projectIdentifier: platform_engineering
  orgIdentifier: default
  tags:
    team: platform-engineering
    type: image-build

  properties:
    ci:
      codebase:
        connectorRef: git_ansible_ee
        repoName: ansible-ee
        build: <+input>

  stages:
    - stage:
        name: Build and Scan EE
        identifier: build_scan
        type: CI
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: ocp_cluster
              namespace: platform-ci
              automountServiceAccountToken: true
          execution:
            steps:
              # -- Lint --
              - step:
                  name: Lint Playbooks
                  identifier: lint
                  type: Run
                  spec:
                    shell: Bash
                    command: |
                      pip install ansible-lint yamllint --quiet --break-system-packages
                      yamllint -c .yamllint.yml .
                      ansible-lint playbooks/ roles/ --strict
                    imagePullPolicy: IfNotPresent

              # -- Build EE context --
              - step:
                  name: Generate Containerfile
                  identifier: generate_containerfile
                  type: Run
                  spec:
                    shell: Bash
                    command: |
                      pip install ansible-builder --quiet --break-system-packages
                      ansible-builder create \
                        --file execution-environment.yml \
                        --output-filename Containerfile
                      echo "--- Generated Containerfile ---"
                      cat context/Containerfile

              # -- Build image --
              - step:
                  name: Build EE Image
                  identifier: build_image
                  type: BuildAndPushDockerRegistry
                  spec:
                    connectorRef: container_registry
                    repo: ghcr.io/ka1ne/ansible-ee
                    tags:
                      - <+pipeline.sequenceId>
                      - <+codebase.commitSha>
                      - latest
                    dockerfile: context/Containerfile
                    context: context/
                    # buildArgs: uncomment and set GALAXY_MIRROR_URL + GALAXY_MIRROR_TOKEN
                    # to route collection installs through a private Automation Hub.

              # -- Scan image --
              - step:
                  name: Trivy Image Scan
                  identifier: trivy_scan
                  type: Run
                  spec:
                    connectorRef: container_registry
                    image: aquasec/trivy:0.58.2
                    shell: Bash
                    command: |
                      trivy image \
                        --severity HIGH,CRITICAL \
                        --exit-code 1 \
                        --format table \
                        --ignorefile .trivyignore \
                        ghcr.io/ka1ne/ansible-ee:<+pipeline.sequenceId>

              # -- SBOM --
              - step:
                  name: Generate SBOM
                  identifier: sbom
                  type: Run
                  spec:
                    connectorRef: container_registry
                    image: anchore/syft:1.19.0
                    shell: Bash
                    command: |
                      syft ghcr.io/ka1ne/ansible-ee:<+pipeline.sequenceId> \
                        -o spdx-json \
                        > /harness/sbom.spdx.json
                    outputVariables:
                      - name: sbom_path
                        type: String
                        value: /harness/sbom.spdx.json

              # -- Scan Galaxy collection contents --
              - step:
                  name: Scan Collections
                  identifier: scan_collections
                  type: Run
                  spec:
                    connectorRef: container_registry
                    image: ghcr.io/ka1ne/ansible-ee:<+pipeline.sequenceId>
                    shell: Bash
                    command: |
                      pip install bandit pip-audit --quiet --break-system-packages
                      chmod +x scripts/scan-collections.sh
                      ./scripts/scan-collections.sh \
                        /usr/share/ansible/collections/ansible_collections \
                        /tmp/scan-results

    # ── Stage 2: Register EE in AWX ──────────────────────────────────────────
    - stage:
        name: Register EE in AWX
        identifier: awx_sync
        type: CI
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: ocp_cluster
              namespace: platform-ci
              automountServiceAccountToken: true
          execution:
            steps:
              - step:
                  name: Sync EE to AWX
                  identifier: awx_sync_ee
                  type: Run
                  spec:
                    # Uses the built EE itself — Python + curl available
                    connectorRef: container_registry
                    image: ghcr.io/ka1ne/ansible-ee:<+pipeline.sequenceId>
                    shell: Bash
                    command: |
                      chmod +x awx/register-ee.sh
                      bash awx/register-ee.sh
                    envVariables:
                      AWX_HOST: <+variable.awx_host>
                      AWX_TOKEN: <+secrets.getValue("awx_token")>
                      EE_IMAGE: ghcr.io/ka1ne/ansible-ee:<+pipeline.sequenceId>
                      EE_NAME: Ansible EE
                      REGISTRY_CRED: Internal Registry
