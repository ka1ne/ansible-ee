---
# .harness/app-deployment.yml
# Harness CI pipeline — POC version
#
# Flow: decode manifest → schema validate → stub SNOW check → run Ansible EE
#
# Replace before use:
#   ocp_cluster        — KubernetesDirect connector ID for your OCP cluster
#   container_registry — Docker registry connector ID for registry.internal.bank
#
# Secrets expected (create in Harness project secrets):
#   winrm_user         — Windows service account username
#   winrm_password     — Windows service account password

pipeline:
  name: app-deployment
  identifier: app_deployment
  projectIdentifier: platform_engineering
  orgIdentifier: default

  variables:
    - name: manifest_b64
      type: String
      description: Base64-encoded manifest YAML from React app
      required: true
      value: <+input>

    - name: environment
      type: String
      description: "Target environment: dev | staging | prod"
      required: true
      value: <+input>
      allowedValues:
        - dev
        - staging
        - prod

    - name: change_request_id
      type: String
      description: ServiceNow CHG number (required for prod)
      required: false
      value: <+input>

  stages:
    # ── Stage 1: Validate ────────────────────────────────────────────────────
    - stage:
        name: Validate
        identifier: validate
        type: CI
        spec:
          cloneCodebase: false
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: ocp_cluster          # TODO: replace
              namespace: platform-ci
              os: Linux

          execution:
            steps:
              - step:
                  name: Decode Manifest
                  identifier: decode_manifest
                  type: Run
                  spec:
                    connectorRef: container_registry  # TODO: replace
                    image: alpine:3.19
                    shell: Sh
                    command: |
                      echo "<+pipeline.variables.manifest_b64>" | base64 -d > /shared/manifest.yml
                      echo "--- decoded manifest ---"
                      cat /shared/manifest.yml
                    sharedPaths:
                      - /shared

              - step:
                  name: Validate Manifest Schema
                  identifier: validate_schema
                  type: Run
                  spec:
                    connectorRef: container_registry  # TODO: replace
                    image: registry.internal.bank/ansible-ee:dev
                    shell: Sh
                    command: |
                      python3 /runner/scripts/validate-manifest.py /shared/manifest.yml \
                        --schema /runner/schemas/manifest-schema.json
                    sharedPaths:
                      - /shared

              - step:
                  name: Change Record Check
                  identifier: snow_check
                  type: Run
                  spec:
                    connectorRef: container_registry  # TODO: replace
                    image: alpine:3.19
                    shell: Sh
                    command: |
                      # ── Stub: replace body with your existing SNOW validation script ──
                      CHANGE_ID="<+pipeline.variables.change_request_id>"
                      ENV="<+pipeline.variables.environment>"

                      if [ "$ENV" = "prod" ] && [ -z "$CHANGE_ID" ]; then
                        echo "ERROR: change_request_id is required for prod"
                        exit 1
                      fi

                      echo "Change record check passed (stub) — CHG: ${CHANGE_ID:-N/A}"
                    sharedPaths:
                      - /shared

    # ── Stage 2: Execute Ansible ─────────────────────────────────────────────
    - stage:
        name: Execute Ansible
        identifier: execute_ansible
        type: CI
        spec:
          cloneCodebase: false
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: ocp_cluster          # TODO: replace
              namespace: platform-ci
              os: Linux

          execution:
            steps:
              - step:
                  name: Run Playbook
                  identifier: run_playbook
                  type: Run
                  timeout: 30m
                  spec:
                    connectorRef: container_registry  # TODO: replace
                    image: registry.internal.bank/ansible-ee:dev
                    shell: Sh
                    command: |
                      # Write manifest into container (shared volume not available cross-stage;
                      # decode again here — same input, deterministic)
                      echo "<+pipeline.variables.manifest_b64>" | base64 -d > /tmp/manifest.yml

                      ENV="<+pipeline.variables.environment>"
                      CHANGE_ID="<+pipeline.variables.change_request_id>"

                      # Extract target_hosts from manifest
                      TARGETS=$(python3 -c "
                      import yaml
                      m = yaml.safe_load(open('/tmp/manifest.yml'))
                      print(m.get('target_hosts', 'all'))
                      ")

                      echo "Environment : ${ENV}"
                      echo "Targets     : ${TARGETS}"
                      echo "Change ID   : ${CHANGE_ID:-N/A}"

                      ansible-playbook /runner/playbooks/site.yml \
                        -i "/runner/inventory/${ENV}.yml" \
                        -e "@/tmp/manifest.yml" \
                        -e "change_id=${CHANGE_ID:-none}" \
                        --limit "${TARGETS}" \
                        -v
                    envVariables:
                      ANSIBLE_WINRM_USER: <+secrets.getValue("winrm_user")>
                      ANSIBLE_WINRM_PASSWORD: <+secrets.getValue("winrm_password")>
                      ANSIBLE_HOST_KEY_CHECKING: "False"
                      ANSIBLE_FORCE_COLOR: "true"
                    resources:
                      limits:
                        cpu: "1"
                        memory: 1Gi

    # ── Stage 3: Notify (stub) ───────────────────────────────────────────────
    - stage:
        name: Notify
        identifier: notify
        type: CI
        spec:
          cloneCodebase: false
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: ocp_cluster          # TODO: replace
              namespace: platform-ci
              os: Linux

          execution:
            steps:
              - step:
                  name: Send Notification
                  identifier: send_notification
                  type: Run
                  spec:
                    connectorRef: container_registry  # TODO: replace
                    image: alpine:3.19
                    shell: Sh
                    command: |
                      # TODO: replace with curl to your Teams/Slack webhook
                      echo "Pipeline   : <+pipeline.name>"
                      echo "Execution  : <+pipeline.executionId>"
                      echo "Environment: <+pipeline.variables.environment>"
                      echo "Status     : <+pipeline.stages.execute_ansible.status>"
