---
# Example manifest YAML generated by the React manifest generator.
# This file is passed to the pipeline as input and consumed by site.yml
# via: ansible-playbook site.yml -e @manifest.yml

# Capabilities selected by the team in the UI
capabilities:
  - iis
  - sqlserver
  - dotnet

# Target hosts — must match groups/hosts in inventory
target_hosts: "windows"

# Environment
env: dev

# Change management
change_id: "CHG0012345"

# Capability-specific configuration (passed as extra vars to roles)
iis_config:
  site_name: "MyWebApp"
  app_pool: "MyAppPool"
  dotnet_version: "v4.0"
  bindings:
    - protocol: https
      port: 443
      hostname: "myapp.internal.bank"
      cert_thumbprint: "ABC123..."

sqlserver_config:
  instance_name: "MSSQLSERVER"
  databases:
    - name: "MyAppDB"
      recovery_model: "FULL"
      collation: "SQL_Latin1_General_CP1_CI_AS"
  backup_schedule: "daily"

dotnet_config:
  version: "8.0"
  deploy_path: "C:\\inetpub\\wwwroot\\MyWebApp"
  artifact_source: "https://nexus.internal.bank/repository/releases/myapp/1.2.3/myapp-1.2.3.zip"
