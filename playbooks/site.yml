---
# site.yml
# Dispatches roles based on capabilities list from manifest YAML.
# Invoked as:
#   ansible-playbook site.yml \
#     -i inventory/<env>.yml \
#     -e @/tmp/manifest.yml \
#     -e "change_id=CHG0012345" \
#     --limit <target_hosts>

- name: "App Deployment — {{ change_id | default('no-change-id') }}"
  hosts: "{{ target_hosts | default('all') }}"
  gather_facts: true
  any_errors_fatal: true

  pre_tasks:
    - name: Validate manifest input
      ansible.builtin.assert:
        that:
          - capabilities is defined
          - capabilities | length > 0
          - target_hosts is defined
        fail_msg: "Missing required manifest variables: capabilities, target_hosts"

    - name: Display execution context
      ansible.builtin.debug:
        msg: |
          Change ID: {{ change_id | default('N/A') }}
          Environment: {{ env | default('unknown') }}
          Capabilities: {{ capabilities | join(', ') }}
          Targets: {{ target_hosts }}

  roles:
    # --- Windows Capabilities ---
    - role: iis_deploy
      when: "'iis' in capabilities"
      tags: [iis]

    - role: sqlserver_deploy
      when: "'sqlserver' in capabilities"
      tags: [sqlserver]

    - role: dotnet_migrate
      when: "'dotnet' in capabilities"
      tags: [dotnet]

    - role: windows_baseline
      when: "'windows_baseline' in capabilities"
      tags: [windows_baseline]

    # --- Linux Capabilities ---
    - role: linux_baseline
      when: "'linux_baseline' in capabilities"
      tags: [linux_baseline]

    # TODO: Add your remaining capability→role mappings here

  post_tasks:
    - name: Deployment summary
      ansible.builtin.debug:
        msg: "Deployment complete for {{ capabilities | join(', ') }} on {{ inventory_hostname }}"
