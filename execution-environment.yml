---
version: 3

images:
  base_image:
    name: registry.internal.bank/ee-minimal-rhel9:latest

dependencies:
  galaxy: requirements.yml
  python: requirements.txt
  system: bindep.txt

options:
  package_manager_path: /usr/bin/microdnf

additional_build_steps:
  prepend_galaxy:
    # Force all Galaxy pulls through internal mirror — no public egress
    - ENV ANSIBLE_GALAXY_SERVER_LIST=internal_hub
    - ENV ANSIBLE_GALAXY_SERVER_INTERNAL_HUB_URL=${GALAXY_MIRROR_URL}
    - ENV ANSIBLE_GALAXY_SERVER_INTERNAL_HUB_TOKEN=${GALAXY_MIRROR_TOKEN}

  append_final:
    - COPY ansible.cfg /etc/ansible/ansible.cfg
    - RUN microdnf clean all && rm -rf /var/cache/yum
    - USER 1000
